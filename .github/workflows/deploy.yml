name: Deploy (AWS Lightsail)

# dev push → 개발 환경(raddit-dev.43-200-205-8.sslip.io). 운영(main)은 후속 이슈에서 이전.
on:
  push:
    branches: [dev, ci/aws-dev-deploy]  # TEMP: 머지 전 검증용, 제거 예정
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy dev
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Node 22 기본 npm(10.x)은 이 의존성 트리에서 arborist 오류(edgesOut of null)로 실패한다
      - name: Use npm 11
        run: npm install -g npm@11.16.0

      - name: Resolve version
        working-directory: raddit-astro
        run: |
          SHA=$(git rev-parse --short HEAD)
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          LATEST=${LATEST:-v0.0.0}
          AHEAD=$(git rev-list --count "${LATEST}..HEAD" 2>/dev/null || echo 0)
          if [ "$AHEAD" -eq 0 ]; then VERSION="${LATEST#v}"; else VERSION="${LATEST#v}-dev.${AHEAD}.${SHA}"; fi
          npm version "$VERSION" --no-git-tag-version
          echo "Resolved version: $VERSION"

      # 서버(RAM 1GB, 다른 서비스와 동거)에서는 빌드도 npm 설치도 하지 않는다.
      # 여기서 빌드하고 런타임 의존성만 남긴 node_modules 까지 묶어 보낸다.
      - name: Build web
        working-directory: raddit-astro
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm prune --omit=dev

      - name: Bundle
        run: |
          mkdir -p bundle/web bundle/reddit
          cp -r raddit-astro/dist raddit-astro/node_modules raddit-astro/package.json bundle/web/
          cp raddit-reddit/app.py raddit-reddit/reddit.py raddit-reddit/requirements.txt bundle/reddit/
          tar -czf "raddit-dev-${GITHUB_SHA}.tgz" -C bundle web reddit
          ls -lh "raddit-dev-${GITHUB_SHA}.tgz"

      - name: Upload and deploy
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEV_SSH_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          B="raddit-dev-${GITHUB_SHA}.tgz"
          scp "$B" "raddit-deploy@${HOST}:/tmp/$B"
          ssh "raddit-deploy@${HOST}" "sudo /opt/raddit-dev/deploy.sh /tmp/$B"

      - name: Smoke test
        run: curl -fsS -o /dev/null -w "%{http_code}\n" --retry 5 --retry-delay 3 https://raddit-dev.43-200-205-8.sslip.io/
